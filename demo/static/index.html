<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Paper Marker - AI Marking Review</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div id="app-root"></div>
<div id="toast-container"></div>

<template id="tpl-landing">
  <header class="site-nav">
    <div class="site-nav-brand">
      <div class="brand-mark" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V2H6.5A2.5 2.5 0 0 0 4 4.5v15Z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></svg>
      </div>
      <span class="gradient-text">Paper Marker</span>
    </div>
    <nav class="site-nav-links">
      <a href="#home" class="active">Home</a>
      <a href="#how-it-works">How It Works</a>
      <a href="#agents">The Agents</a>
      <a href="#about">About</a>
    </nav>
    <div class="site-nav-actions">
      <button id="nav-sign-in" class="nav-signin">Sign In</button>
      <button id="nav-sign-up" class="primary nav-signup">Sign Up</button>
    </div>
  </header>

  <main class="landing">
    <section class="hero" id="home">
      <div class="hero-copy">
        <div class="hero-eyebrow">Efficient &middot; Accurate &middot; Secure</div>
        <h1>AI-powered exam marking <span class="gradient-text">platform</span></h1>
        <p class="hero-sub">
          Paper Marker digitizes university exam evaluation end to end: a scanned
          answer sheet gets an anonymous UUID, four AI agents mark it against the
          rubric with quoted evidence, and a teacher reviews and approves the
          result before it's final.
        </p>
        <div class="hero-actions">
          <button class="primary hero-btn" id="hero-get-started">Get Started</button>
          <button class="hero-btn hero-btn-ghost" id="hero-sign-in">Sign In</button>
        </div>
        <div class="hero-tags">
          <span>&#10003; Anonymous UUID per paper</span>
          <span>&#10003; Evidence-quoted marking</span>
          <span>&#10003; Human-in-the-loop review</span>
        </div>
      </div>
      <div class="hero-shot-wrap">
        <div class="browser-chrome">
          <span class="dot dot-red"></span><span class="dot dot-amber"></span><span class="dot dot-green"></span>
          <span class="browser-chrome-title">Marking Queue &mdash; live</span>
        </div>
        <img src="/static/hero-preview.png" alt="Paper Marker AI marking review screen" class="hero-shot">
      </div>
    </section>

    <section class="feature-strip" id="how-it-works">
      <div class="feature-card">
        <div class="feature-num">1</div>
        <h3>Upload</h3>
        <p>Admin uploads a scanned answer sheet (photo or PDF). The page is OCR'd and an Anonymous UUID is generated automatically.</p>
      </div>
      <div class="feature-card">
        <div class="feature-num">2</div>
        <h3>AI Marks It</h3>
        <p id="agents">Four agents run in sequence &mdash; Rubric, Solution, Evaluation, Critic &mdash; quoting the exact evidence for every mark, in Urdu or English.</p>
      </div>
      <div class="feature-card">
        <div class="feature-num">3</div>
        <h3>Teacher Reviews</h3>
        <p>Admin assigns the paper to a Teacher, who accepts, adjusts, or flags the AI's marking before it's final.</p>
      </div>
      <div class="feature-card">
        <div class="feature-num">4</div>
        <h3>Student Sees Result</h3>
        <p>Once reviewed, the student can sign in and see their score &mdash; nothing more, nothing less.</p>
      </div>
    </section>

    <section class="about-strip" id="about">
      <p>Final year project &middot; Department of Computer Science, Air University Islamabad &middot; in collaboration with Intelligement</p>
    </section>
  </main>
</template>

<template id="tpl-login">
  <div class="auth-split">
    <div class="auth-left">
      <div class="auth-left-inner">
        <div class="login-brand">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V2H6.5A2.5 2.5 0 0 0 4 4.5v15Z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></svg>
          <span class="gradient-text">Paper Marker</span>
        </div>
        <h2>Login</h2>
        <p class="login-sub">Sign in to your Marking Queue, dashboard, or results.</p>

        <div class="form-field">
          <label>Email</label>
          <input type="text" id="login-email" placeholder="Enter your email">
        </div>
        <div class="form-field">
          <label>Password</label>
          <div class="password-field">
            <input type="password" id="login-password" placeholder="Enter your password">
            <button type="button" class="password-eye" id="login-password-eye" aria-label="Show password">&#128065;</button>
          </div>
        </div>
        <div class="form-field">
          <label>Select Role</label>
          <select class="form-input" id="login-role">
            <option value="Teacher">Teacher</option>
            <option value="Admin">Admin</option>
            <option value="Student">Student</option>
          </select>
        </div>

        <div class="auth-row">
          <label class="remember-me"><input type="checkbox" id="login-remember"> Remember me</label>
          <a href="#" id="link-forgot">Forgot password?</a>
        </div>

        <button class="primary login-btn" id="btn-login">Sign In</button>
        <div id="login-error" class="login-error"></div>

        <div class="quick-roles">
          <button class="quick-role role-admin" data-role="Admin">Admin</button>
          <button class="quick-role role-teacher" data-role="Teacher">Teacher</button>
          <button class="quick-role role-student" data-role="Student">Student</button>
        </div>
        <div class="login-hint">Demo accounts &mdash; click a role above to sign in instantly.</div>

        <p class="auth-switch">Don't have an account? <a href="#" id="link-register">Sign up</a></p>
        <div class="login-links"><a href="#" id="link-back-home-1">&larr; Back to home</a></div>
        <div class="auth-footer">&copy; 2026 Paper Marker &middot; FYP, Air University Islamabad</div>
      </div>
    </div>

    <div class="auth-right">
      <div class="auth-shot-card">
        <div class="browser-chrome">
          <span class="dot dot-red"></span><span class="dot dot-amber"></span><span class="dot dot-green"></span>
          <span class="browser-chrome-title">Marking Queue &mdash; live</span>
        </div>
        <img src="/static/hero-preview.png" alt="Paper Marker AI marking review screen" class="hero-shot">
      </div>
      <div class="auth-stat-badge">
        <div class="auth-stat-label">EVIDENCE-VERIFIED</div>
        <div class="auth-stat-num">Every mark, quoted</div>
      </div>
      <div class="auth-tagline">
        <h2>Every mark, evidence-backed.</h2>
        <p>Anonymous, multi-agent, human-reviewed.</p>
      </div>
    </div>
  </div>
</template>

<template id="tpl-register">
  <div class="auth-split">
    <div class="auth-left">
      <div class="auth-left-inner">
        <div class="login-brand">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V2H6.5A2.5 2.5 0 0 0 4 4.5v15Z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></svg>
          <span class="gradient-text">Paper Marker</span>
        </div>

        <div id="register-step-form">
          <h2>Sign Up</h2>
          <p class="login-sub">Create your account to start using Paper Marker.</p>

          <div class="info-callout">
            <span class="info-callout-icon">&#127891;</span>
            <div>
              <b>Use the right email for your role.</b>
              Teachers sign up with an <b>@gmail.com</b> address, Students with their
              <b>@students.au.edu.pk</b> address. Admin accounts are provisioned separately
              and can't self-register.
            </div>
          </div>

          <div class="form-field">
            <label>Role</label>
            <select class="form-input" id="reg-role">
              <option value="Student">Student</option>
              <option value="Teacher">Teacher</option>
            </select>
          </div>
          <div class="form-field">
            <label>Full Name</label>
            <input type="text" id="reg-name" placeholder="e.g. Ali Ahmed">
          </div>
          <div class="form-field">
            <label>Email <span class="hint" id="reg-domain-hint"></span></label>
            <input type="text" id="reg-email" placeholder="Enter your email">
          </div>
          <div class="form-field">
            <label>Password</label>
            <div class="password-field">
              <input type="password" id="reg-password" placeholder="Create a password">
              <button type="button" class="password-eye" id="reg-password-eye" aria-label="Show password">&#128065;</button>
            </div>
            <div class="field-hint">Must be at least 6 characters.</div>
          </div>
          <div class="form-field">
            <label>Confirm Password</label>
            <div class="password-field">
              <input type="password" id="reg-password-confirm" placeholder="Re-enter password">
              <button type="button" class="password-eye" id="reg-password-confirm-eye" aria-label="Show password">&#128065;</button>
            </div>
          </div>

          <button class="primary login-btn" id="btn-register">Create my account</button>
          <div id="register-error" class="login-error"></div>
          <p class="auth-switch">Already have an account? <a href="#" id="link-back-to-login-1">Sign in</a></p>
          <div class="login-links"><a href="#" id="link-back-home-2">&larr; Back to home</a></div>
        </div>

        <div id="register-step-verify" style="display:none">
          <h2>Verify Your Email</h2>
          <p class="login-sub" id="verify-target-email"></p>
          <div class="demo-mail-note" id="demo-mail-note"></div>

          <div class="form-field">
            <label>Verification Code</label>
            <input type="text" id="verify-code" placeholder="6-digit code" maxlength="6">
          </div>
          <button class="primary login-btn" id="btn-verify">Verify Email</button>
          <div id="verify-error" class="login-error"></div>
          <div class="login-links"><a href="#" id="link-back-to-login-2">Back to sign in</a></div>
          <div class="login-links"><a href="#" id="link-back-home-3">&larr; Back to home</a></div>
        </div>
      </div>
    </div>

    <div class="auth-right">
      <div class="auth-quote">
        <p>&ldquo;Every criterion is checked against the exact words a student
        wrote &mdash; not a guess, and not a black box. If the evidence isn't
        there, the mark isn't either.&rdquo;</p>
        <div class="auth-quote-attr">How the Evaluation and Critic agents work together</div>
      </div>
      <div class="auth-shot-card auth-shot-card-sm">
        <div class="browser-chrome">
          <span class="dot dot-red"></span><span class="dot dot-amber"></span><span class="dot dot-green"></span>
          <span class="browser-chrome-title">Marking Queue &mdash; live</span>
        </div>
        <img src="/static/hero-preview.png" alt="Paper Marker AI marking review screen" class="hero-shot">
      </div>
    </div>
  </div>
</template>

<template id="tpl-shell">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V2H6.5A2.5 2.5 0 0 0 4 4.5v15Z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></svg>
      </div>
      <div>
        <h1>Paper Marker</h1>
        <div class="subtitle">AI Marking Review &middot; Rubric &rarr; Solution &rarr; Evaluation &rarr; Critic</div>
      </div>
    </div>
    <nav class="top-nav" id="top-nav"></nav>
    <div class="user-chip">
      <div>
        <div class="user-name" id="user-name"></div>
        <div class="user-role-badge" id="user-role-badge"></div>
      </div>
      <select class="model-select-inline" id="model">
        <option value="stub">Model: Stub (instant)</option>
        <option value="real">Model: qwen2.5:7b (real, slow)</option>
      </select>
      <button class="logout-btn" id="btn-logout">Log Out</button>
    </div>
  </header>
  <div class="app-layout" id="app-layout">
    <aside class="sidebar" id="app-sidebar"></aside>
    <main class="main-content" id="main-content"></main>
  </div>
</template>

<script src="/static/app.js"></script>
</body>
</html>
